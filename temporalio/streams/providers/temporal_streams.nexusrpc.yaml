# The stream endpoint's wire contract. Inputs reject unknown fields so a typo
# fails loudly at the handler; outputs accept them so a handler can add a
# field before every caller has been rebuilt from the newer contract.
nexusrpc: "1.0.0"

services:
  TemporalStreams:
    fqn: TemporalStreams
    description: >-
      The stream endpoint's two operations. One Temporal-authenticated endpoint
      hides the store behind it, so an operator switches storage without
      touching callers. Reads hand out batches and an append carries one batch
      per call, because a Nexus operation per record costs too much for token
      streams. A record crosses as the serialized
      temporal.api.stream.v1.StreamRecord, the same bytes every store keeps, so
      a caller in any language decodes it with the api protos alone.
    operations:
      append:
        fqn: append
        description: >-
          Append one batch on the caller's account. The handler writes a batch
          once: a repeat of the last batch_index answers with where the
          original landed, and an index that skips ahead, one already behind
          the last, a sequence that does not continue, or a producer attempt
          the handler has no state for is refused. Supersession records are not
          transported: a reader re-synthesizes them from the attempts it
          observes.
        input: { $ref: "#/$defs/AppendInput" }
        output: { $ref: "#/$defs/AppendOutput" }
      read:
        fqn: read
        description: >-
          Answer with the records after the caller's token, or time out. The
          call parks until it has max_records records or wait_ms elapses,
          whichever comes first, and returns whatever it collected. It says
          when the store has ended the read, so the caller can stop.
        input: { $ref: "#/$defs/ReadInput" }
        output: { $ref: "#/$defs/ReadOutput" }

$defs:
  AppendInput:
    type: object
    description: "One append call: who is writing, where, and what."
    properties:
      workflow_id:
        type: string
        description: "The workflow whose stream is being written."
      run_id:
        type: string
        description: >-
          The run to address. Empty addresses the workflow's execution chain,
          which is what a producer normally wants.
      topic:
        type: string
        description: "The topic of the workflow's stream to append to."
      producer_id:
        type: string
        description: >-
          Identifies the writer across its retries, so its attempts can be
          ordered. Never empty here: the caller resolved it, from the activity
          context when it was not given.
      attempt:
        type: integer
        description: >-
          The generation this producer is writing. A later attempt supersedes
          an earlier one.
      sequence:
        type: integer
        minimum: 0
        description: >-
          The producer's sequence of the first record in this batch; the batch
          is numbered from it and a finish takes the next number. It has to
          continue where the previous batch ended, so the handler and the
          store agree on every record's position within the attempt.
      batch_index:
        type: integer
        minimum: 1
        description: >-
          Counts this producer's batches from 1. The handler answers a repeat
          of the last index with the original's position, and refuses one that
          skips ahead, one already behind the last, or one that resumes an
          attempt it never saw start.
      payloads:
        type: array
        items:
          type: string
          contentEncoding: base64
        description: >-
          The record bodies to write, in order, each a serialized
          temporal.api.common.v1.Payload. A payload codec configured on the
          caller has already run on them. Empty on a call that only finishes.
      finish:
        type: boolean
        description: >-
          Write FINISH for this producer after the batch: it will write nothing
          more on the topic. Says nothing about the producer's outcome.
    required:
      - workflow_id
      - topic
      - producer_id
      - attempt
      - sequence
      - batch_index
    additionalProperties: false

  AppendOutput:
    type: object
    description: "Where the append landed, when the store can say."
    properties:
      cursor:
        type: string
        description: >-
          Opaque token naming the last record written by this call, or by the
          original when the call repeated the last batch. Absent when the
          store learns positions only at read time; such a caller positions
          itself with a latest_only read.
    additionalProperties: true

  ReadInput:
    type: object
    description: "One read call: where to resume from and how long to wait."
    properties:
      workflow_id:
        type: string
        description: "The workflow whose stream is being read."
      run_id:
        type: string
        description: >-
          Pin the read to this run. Empty follows the workflow's execution
          chain across continue-as-new.
      topic:
        type: string
        description: "The topic of the workflow's stream to read."
      after_token:
        type: string
        description: >-
          Opaque cursor from an earlier record or append. The read resumes
          strictly after the record it names, so a caller never sees that
          record twice. Empty starts at the beginning. The token is produced by
          whichever store sits behind the endpoint, so a caller cannot tell
          which one that is, and a token from another store is refused.
      max_records:
        type: integer
        minimum: 1
        maximum: 1000
        description: "Return at most this many records. Defaults to 100 when omitted."
      wait_ms:
        type: integer
        minimum: 0
        maximum: 60000
        description: >-
          Wait at most this long for records to arrive before answering. The
          handler shortens it to fit the request deadline. A call that collects
          nothing answers with no records and the caller's own token.
      latest_only:
        type: boolean
        description: >-
          Answer with the newest position and no records, for a reader that
          wants to follow from now.
    required:
      - workflow_id
      - topic
    additionalProperties: false

  RecordWire:
    type: object
    description: "One record on the wire: its cursor and the record itself."
    properties:
      token:
        type: string
        description: >-
          Opaque cursor naming this record. Pass it as after_token to resume
          just past it.
      record:
        type: string
        contentEncoding: base64
        description: >-
          The serialized temporal.api.stream.v1.StreamRecord: topic, kind,
          producer_id, attempt, sequence and body, as the store holds it.
    required:
      - token
      - record
    additionalProperties: true

  ReadOutput:
    type: object
    description: "What one read call answered, and where to resume."
    properties:
      records:
        type: array
        items:
          $ref: "#/$defs/RecordWire"
        description: "The records after the caller's token, in stream order."
      next_token:
        type: string
        description: >-
          Opaque cursor to pass as after_token on the following call. Echoes
          the caller's own token when the call collected nothing.
      done:
        type: boolean
        description: >-
          The store ended the read: the owning execution, or its chain, is
          closed and every retained record after the caller's token has been
          delivered. Nothing more will arrive, so the caller stops.
    additionalProperties: true
